name: Video Render Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID to process'
        required: true
        type: string
      job_type:
        description: 'Type of job (render_video, render_short, generate_thumbnail)'
        required: true
        type: string
      payload:
        description: 'JSON payload with job parameters'
        required: true
        type: string

  repository_dispatch:
    types: [render_job]

permissions:
  contents: read
  id-token: write

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Worker authentication
      WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
      WORKER_SIGNING_SECRET: ${{ secrets.WORKER_SIGNING_SECRET }}
      # Database (persistent job status + the actual pipeline needs it too)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # ۲۰۲۶-۰۸-۲۰ — لازمه چون providers/crypto.js از همین متغیر به‌عنوان
      # کلیدِ AES برای decrypt کردنِ کلیدهای API که تو دیتابیس ذخیره شدن
      # استفاده می‌کنه (به‌جای یک secret جداگانه). بدونش هر provider
      # دیتابیسی (نه env-var-based) تو worker شکست می‌خورد.
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      # Provider API keys (encrypted in DB, but worker may need some)
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      # ۲۰۲۶-۰۸-۲۰ — قبلاً اینجا GOOGLE_CLIENT_ID/SECRET بود که worker
      # مستقیم برای رفرشِ توکنِ گوگل استفاده می‌کرد؛ نگه‌داشتنِ یه کپیِ
      # دومِ این اعتبارنامه‌ها تو GitHub secrets چند دور خطای مختلف داد
      # (invalid_client، deleted_client). حالا worker به‌جاش یه توکنِ
      # آماده از یک endpointِ داخلیِ خودِ وب‌اپ می‌گیره (فقط با
      # WORKER_API_KEY احراز هویت می‌شه) — پس دیگه هیچ اعتبارنامه‌ی
      # گوگلی اینجا لازم نیست. فقط آدرسِ خودِ سایت رو نیاز داره:
      NEXT_PUBLIC_APP_URL: "https://youtube-studio-7bnw.onrender.com"
      # ۲۰۲۶-۰۸-۱۸ — این سه‌تا رو *اینجا*، تو env سطحِ job تعریف می‌کنیم
      # (نه مستقیم تو یک run: با ${{ }}) تا مقدارشون به‌عنوان یک متغیرِ
      # محیطیِ shell دیده بشه، نه این‌که قبل از اجرای shell متنی جایگزین
      # بشه. تزریقِ مستقیمِ ${{ }} تو یک run: دقیقاً همون الگوی
      # command-injection ایه که خودِ GitHub بهش هشدار می‌ده — و چون
      # payload شامل متنِ واقعیِ اسکریپت/عنوانه، هر آپاستروف توش
      # (خیلی رایج تو متنِ انگلیسی) دستور رو با یک syntax error می‌شکست.
      JOB_ID: ${{ github.event.inputs.job_id || github.event.client_payload.job_id }}
      JOB_TYPE: ${{ github.event.inputs.job_type || github.event.client_payload.job_type }}
      JOB_PAYLOAD: ${{ github.event.inputs.payload || github.event.client_payload.payload }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify bundled FFmpeg (from @ffmpeg-installer/ffmpeg via npm)
        # ۲۰۲۶-۰۸-۱۹ — این مرحله قبلاً apt-get install ffmpeg بود، که هم
        # کند بود (~۷۰+ پکیجِ وابسته، چند دقیقه دانلود) هم یک‌بار رو یک
        # promptِ debconf ۳۰+ دقیقه گیر کرد — و اصلاً *لازم* هم نبود:
        # هیچ‌جای کدِ اپ (rendering/index.js) بایننریِ سیستمیِ ffmpeg رو
        # صدا نمی‌زنه، همیشه از ffmpegInstaller.path استفاده می‌کنه (که
        # همین الان با npm ci نصب شد) — دقیقاً همون‌طور که رو Render هم
        # کار می‌کنه (اونجا هم apt در کار نیست). این مرحله فقط یه چکِ
        # سریعِ سلامتیه، نه یک نصبِ جدا.
        run: node -e "const p=require('@ffmpeg-installer/ffmpeg').path; require('child_process').execFileSync(p,['-version'],{stdio:'inherit'});"

      - name: Preflight check - DATABASE_URL
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not configured. Add it as a Repository Secret in GitHub Settings > Secrets and variables > Actions > Repository secrets"
            exit 1
          fi
          echo "DATABASE_URL is configured (value hidden)"

      - name: Verify fonts and assets
        run: |
          ls -la public/fonts/
          ls -la public/maya/
          ls -la public/audio/bgm/ 2>/dev/null || echo "BGM dir not found (optional)"

      - name: Run worker
        id: worker
        # JOB_ID/JOB_TYPE/JOB_PAYLOAD از env سطحِ job میان — اینجا فقط
        # ارجاعِ shell به یک متغیرِ محیطیه (کاملاً امن حتی اگه شامل
        # کوتیشن یا هر کاراکترِ دیگه‌ای باشه)، نه جایگزینیِ متنیِ GitHub.
        run: node src/worker/index.js "$JOB_ID" "$JOB_TYPE" "$JOB_PAYLOAD"
        shell: bash

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-logs-${{ env.JOB_ID }}
          path: |
            /tmp/worker-*.log
          retention-days: 7

      - name: Notify completion
        if: always()
        run: |
          echo "Job $JOB_ID completed with status: ${{ job.status }}"
          # Could call webhook here if ALERT_WEBHOOK_URL is set