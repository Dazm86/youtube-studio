name: Video Render Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID to process'
        required: true
        type: string
      job_type:
        description: 'Type of job (render_video, render_short, generate_thumbnail)'
        required: true
        type: string
      payload:
        description: 'JSON payload with job parameters'
        required: true
        type: string

  repository_dispatch:
    types: [render_job]

permissions:
  contents: read
  id-token: write

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Worker authentication
      WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
      # Database (if needed for status updates)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Provider API keys (encrypted in DB, but worker may need some)
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      # YouTube OAuth (for worker uploads if needed)
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Verify fonts and assets
        run: |
          ls -la public/fonts/
          ls -la public/maya/
          ls -la public/audio/bgm/ 2>/dev/null || echo "BGM dir not found (optional)"

      - name: Run worker
        id: worker
        run: |
          node src/worker/index.js "${{ github.event.inputs.job_id || github.event.client_payload.job_id }}" \
            "${{ github.event.inputs.job_type || github.event.client_payload.job_type }}" \
            '${{ github.event.inputs.payload || github.event.client_payload.payload }}'
        shell: bash

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-logs-${{ github.event.inputs.job_id || github.event.client_payload.job_id }}
          path: |
            /tmp/worker-*.log
          retention-days: 7

      - name: Notify completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          JOB_ID="${{ github.event.inputs.job_id || github.event.client_payload.job_id }}"
          echo "Job $JOB_ID completed with status: $STATUS"
          # Could call webhook here if ALERT_WEBHOOK_URL is set